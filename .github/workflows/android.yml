# Збирає KolySvitlo.apk (віджет + сповіщення для Android) і додає до релізу GitHub.
# Тег v* → APK у релізі поруч з KolySvitlo.exe. Гілка android-* → лише пробна збірка (артефакт).
name: Android (APK)

on:
  push:
    tags: ["v*"]
    branches: ["android-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Постійний ключ підпису (тоді нова версія ставиться поверх старої): зашифрований
      # android/release-key.p12.enc + пароль із секрету ANDROID_KEYSTORE_PASS.
      # Без секрету — лише пробна збірка з debug-ключем; реліз без постійного ключа не публікуємо.
      - name: Ключ підпису
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/release-key.p12.enc \
              -out "$RUNNER_TEMP/release.p12" -pass env:KS_PASS
            echo "KS_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Немає секрету ANDROID_KEYSTORE_PASS — APK для релізу має бути підписаний постійним ключем"
            exit 1
          else
            echo "::warning::Немає секрету ANDROID_KEYSTORE_PASS — пробний APK підписано тимчасовим ключем"
          fi
      - name: Зібрати APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: kolysvitlo
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.$GITHUB_RUN_NUMBER"; fi
          IFS=. read -r A B C <<< "$V"
          CODE=$(( A * 10000 + B * 100 + ${C:-0} ))
          gradle -p android --no-daemon testDebugUnitTest assembleRelease -PversionName="$V" -PversionCode="$CODE"
          cp android/app/build/outputs/apk/release/app-release.apk KolySvitlo.apk
          ls -l KolySvitlo.apk
      - name: Перевірити підпис
        env:
          # відбиток сертифіката постійного ключа (публічний, див. keys/ПРОЧТИ.txt у автора)
          EXPECTED: a6255ac62130c0a640a6be51b00d60febbbe7aad8f3098b191ff82baf2f5ffaf
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs KolySvitlo.apk | tee certs.txt
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && ! grep -qi "SHA-256 digest: $EXPECTED" certs.txt; then
            echo "::error::APK підписано не постійним ключем"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: KolySvitlo-apk
          path: KolySvitlo.apk
      - name: Додати до релізу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # реліз може створювати паралельна збірка exe — тому повтори; чернетку знімаємо
        run: |
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" KolySvitlo.apk --clobber &&
                gh release edit "$TAG" --draft=false
            else
              gh release create "$TAG" KolySvitlo.apk \
                --title "Коли світло? $TAG" --notes-file .github/release-notes.md
            fi
          }
          for attempt in 1 2 3 4 5; do
            publish && exit 0
            echo "Спроба $attempt не вдалася, повтор за $((attempt * 20)) с"
            sleep $((attempt * 20))
          done
          exit 1

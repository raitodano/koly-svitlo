# Збирає KolySvitlo.exe на Windows і додає його до релізу GitHub.
# Запуск: створити й відправити тег, напр.  git tag v1.0.1  &&  git push origin v1.0.1
name: Реліз exe

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Тести розбору
        run: python -m unittest discover -s tests
      - name: Зібрати KolySvitlo.exe
        shell: pwsh
        run: ./build_exe.ps1
      - name: Перевірити, що exe запускається
        shell: pwsh
        run: |
          Start-Process dist\KolySvitlo.exe -ArgumentList '--port','8790','--no-browser','--local-only' -WindowStyle Hidden
          Start-Sleep -Seconds 8
          try { $r = Invoke-WebRequest http://localhost:8790/ -UseBasicParsing -TimeoutSec 20 }
          finally { Get-Process KolySvitlo -ErrorAction SilentlyContinue | Stop-Process -Force }  # onefile = 2 процеси
          if ($r.StatusCode -ne 200) { throw "exe не віддає сторінку: $($r.StatusCode)" }
      - name: Опублікувати реліз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KolySvitlo.exe --clobber
          else
            gh release create "$TAG" dist/KolySvitlo.exe \
              --title "Коли світло? $TAG" --notes-file .github/release-notes.md
          fi

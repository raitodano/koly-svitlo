# Публікує сайт на GitHub Pages і щокілька хвилин оновлює data.json з info.dpem.mk.ua.
name: Сайт (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    # GitHub запускає розклад «з найкращими зусиллями»: на початку години черга найбільша й запуски
    # губляться, тому хвилини зсунуті. Навіть так бувають пропуски на години — тому на сайті
    # є кнопка «Звірити графіки», яка читає сайт ДПЕМ напряму з браузера.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Тести розбору
        run: python -m unittest discover -s tests
      - name: Завантажити графіки й зібрати сайт
        run: python build_static.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Опублікувати
        id: deployment
        uses: actions/deploy-pages@v4
